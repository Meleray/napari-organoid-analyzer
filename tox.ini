[tox]
# envlist = py{311,312,313,314}-{linux,macos,windows}
envlist = py{311}-{linux}
isolated_build=true

# [tool:check-wheel-contents]
# ignore = 
#     "W002"

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
dependency_groups =
    dev
# commands = pytest -v --color=yes --cov=napari_organoid_analyzer --cov-report=xml
commands = 
    pip install ".[all]"
    pip install ".[all,czifile]"
    pip install ".[all,mp4]"
    pytest -v --color=yes --cov=napari_organoid_analyzer --cov-report=xml
